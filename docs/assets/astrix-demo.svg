<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Astrix visual control plane: bounded self-healing and progressive canary</title>
  <desc id="desc">A five-stage animated architecture dashboard showing AxLang policy compilation, an AST blast-radius graph, isolated tests, LLM repair behind OPA, Merkle caching, and canary telemetry.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f19"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111a2a"/><stop offset="1" stop-color="#0e1624"/></linearGradient>
    <linearGradient id="redFill"><stop stop-color="#7f1d1d" stop-opacity=".5"/><stop offset="1" stop-color="#2b1722" stop-opacity=".75"/></linearGradient>
    <linearGradient id="greenFill"><stop stop-color="#064e3b" stop-opacity=".62"/><stop offset="1" stop-color="#102a2a" stop-opacity=".9"/></linearGradient>
    <filter id="glowCyan" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowGreen" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#a855f7"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-opacity=".24" stroke-width="1"/></pattern>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .panel{fill:url(#panel);stroke:#263449;stroke-width:1.2}.head{fill:#e2e8f0;font-size:11px;font-weight:700;letter-spacing:1px}.muted{fill:#8190a5}.light{fill:#dbe5f2}.tiny{font-size:9px}.small{font-size:10px}.label{font-size:11px}
    .cyan{fill:#38bdf8}.purple{fill:#a855f7}.red{fill:#f87171}.green{fill:#4ade80}.amber{fill:#fbbf24}.emerald{fill:#10b981}
    .stageGlow{opacity:.12;animation:pulse 1.3s ease-in-out infinite}.s1{animation:focus1 12s linear infinite}.s2{animation:focus2 12s linear infinite}.s3r{animation:focus3r 12s linear infinite}.s3g{animation:focus3g 12s linear infinite}.s4a{animation:focus4a 12s linear infinite}.s4g{animation:focus4g 12s linear infinite}.s5{animation:focus5 12s linear infinite}
    .dash{stroke-dasharray:6 7;animation:flow 1.2s linear infinite}.redNode{animation:redNode 12s linear infinite}.greenNode{animation:greenNode 12s linear infinite}.brokenLine{animation:broken 12s linear infinite}.fixedLine{animation:fixed 12s linear infinite}
    .feedFail{animation:feedFail 12s linear infinite}.feedFix{animation:feedFix 12s linear infinite}.feedPass{animation:feedPass 12s linear infinite}.canary1{animation:canary1 12s linear infinite}.canary2{animation:canary2 12s linear infinite}.canary3{animation:canary3 12s linear infinite}.canary4{animation:canary4 12s linear infinite}
    .liveDot{animation:dotPulse 1.4s ease-in-out infinite}.rollout{transform-box:fill-box;transform-origin:left;animation:rollout 12s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}@keyframes flow{to{stroke-dashoffset:-26}}
    @keyframes focus1{0%,19.9%{opacity:1}20%,100%{opacity:0}}@keyframes focus2{0%,19.9%{opacity:0}20%,39.9%{opacity:1}40%,100%{opacity:0}}
    @keyframes focus3r{0%,39.9%{opacity:0}40%,59.9%{opacity:1}60%,100%{opacity:0}}@keyframes focus3g{0%,59.9%{opacity:0}60%,100%{opacity:1}}
    @keyframes focus4a{0%,59.9%{opacity:0}60%,79.9%{opacity:1}80%,100%{opacity:0}}@keyframes focus4g{0%,79.9%{opacity:0}80%,100%{opacity:1}}@keyframes focus5{0%,79.9%{opacity:0}80%,100%{opacity:1}}
    @keyframes redNode{0%,58%{opacity:1}68%,100%{opacity:0}}@keyframes greenNode{0%,58%{opacity:0}68%,100%{opacity:1}}@keyframes broken{0%,57%{opacity:1}67%,100%{opacity:0}}@keyframes fixed{0%,57%{opacity:0}67%,100%{opacity:1}}
    @keyframes feedFail{0%,39%{opacity:1}50%,100%{opacity:.55}}@keyframes feedFix{0%,39%{opacity:.55}50%,79%{opacity:1}90%,100%{opacity:.65}}@keyframes feedPass{0%,69%{opacity:.5}80%,100%{opacity:1}}
    @keyframes canary1{0%,19%{opacity:.4}20%,100%{opacity:1}}@keyframes canary2{0%,39%{opacity:.35}40%,100%{opacity:1}}@keyframes canary3{0%,59%{opacity:.3}60%,100%{opacity:1}}@keyframes canary4{0%,79%{opacity:.2}80%,100%{opacity:1}}
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes rollout{0%{transform:scaleX(.05)}20%{transform:scaleX(.25)}40%{transform:scaleX(.55)}80%,99%{transform:scaleX(1)}100%{transform:scaleX(.05)}}
  </style>
  <rect width="960" height="580" rx="18" fill="url(#canvas)"/><rect width="960" height="580" rx="18" fill="url(#grid)" opacity=".55"/><path d="M0 49H960" stroke="#263449"/>
  <rect x="20" y="13" width="26" height="26" rx="8" fill="#0c3546" stroke="#38bdf8"/><path d="m26 31 7-13 7 13h-4l-3-6-3 6z" fill="#38bdf8"/>
  <text x="56" y="25" class="ui light" font-size="15" font-weight="750" letter-spacing="1.1">ASTRIX</text><text x="113" y="25" class="ui muted" font-size="11">AGENTIC DEVOPS CONTROL PLANE</text>
  <rect x="793" y="14" width="145" height="24" rx="12" fill="#102a26" stroke="#176b53"/><circle class="liveDot" cx="808" cy="26" r="3.5" fill="#4ade80"/><text x="819" y="30" class="ui green" font-size="9" font-weight="700" letter-spacing=".8">CLOSED LOOP · 12s</text>

