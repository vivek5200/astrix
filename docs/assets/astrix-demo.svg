  <g class="ui">
    <path d="M197 82H209M385 82H397M573 82H585M761 82H773" stroke="#334155" stroke-width="3"/><path class="dash" d="M197 82H209M385 82H397M573 82H585M761 82H773" stroke="#38bdf8" stroke-width="2" opacity=".85"/>
    <g><rect x="20" y="59" width="177" height="46" rx="12" fill="#111b2b" stroke="#155e75"/><rect class="stageGlow s1" x="20" y="59" width="177" height="46" rx="12" fill="#38bdf8" filter="url(#glowCyan)"/><circle cx="39" cy="82" r="11" fill="#12394a" stroke="#38bdf8"/><text x="39" y="86" class="mono cyan" font-size="10" text-anchor="middle">1</text><text x="56" y="86" class="ui light" font-size="10.5" font-weight="650">AxLang .ax → Rego</text><rect class="s1" x="26" y="100" width="165" height="2" rx="1" fill="#38bdf8"/></g>
    <g><rect x="209" y="59" width="176" height="46" rx="12" fill="#111b2b" stroke="#583082"/><rect class="stageGlow s2" x="209" y="59" width="176" height="46" rx="12" fill="#a855f7"/><circle cx="228" cy="82" r="11" fill="#302049" stroke="#a855f7"/><text x="228" y="86" class="mono purple" font-size="10" text-anchor="middle">2</text><text x="245" y="86" class="ui light" font-size="10.5" font-weight="650">AST Blast Radius</text><rect class="s2" x="215" y="100" width="164" height="2" rx="1" fill="#a855f7"/></g>
    <g><rect x="397" y="59" width="176" height="46" rx="12" fill="#111b2b" stroke="#7f343b"/><rect class="stageGlow s3r" x="397" y="59" width="176" height="46" rx="12" fill="#f87171"/><rect class="stageGlow s3g" x="397" y="59" width="176" height="46" rx="12" fill="#4ade80"/><circle cx="416" cy="82" r="11" fill="#38242b" stroke="#f87171" class="s3r"/><circle cx="416" cy="82" r="11" fill="#12372c" stroke="#4ade80" class="s3g"/><text x="416" y="86" class="mono light" font-size="10" text-anchor="middle">3</text><text x="433" y="86" class="ui light" font-size="10.5" font-weight="650">Sandbox Test</text><rect class="s3r" x="403" y="100" width="164" height="2" rx="1" fill="#f87171"/><rect class="s3g" x="403" y="100" width="164" height="2" rx="1" fill="#4ade80"/></g>
    <g><rect x="585" y="59" width="176" height="46" rx="12" fill="#111b2b" stroke="#755525"/><rect class="stageGlow s4a" x="585" y="59" width="176" height="46" rx="12" fill="#fbbf24"/><rect class="stageGlow s4g" x="585" y="59" width="176" height="46" rx="12" fill="#4ade80"/><circle cx="604" cy="82" r="11" fill="#392f1b" stroke="#fbbf24" class="s4a"/><circle cx="604" cy="82" r="11" fill="#12372c" stroke="#4ade80" class="s4g"/><text x="604" y="86" class="mono light" font-size="10" text-anchor="middle">4</text><text x="621" y="86" class="ui light" font-size="9.6" font-weight="650">LLM Triage + OPA Gate</text><rect class="s4a" x="591" y="100" width="164" height="2" rx="1" fill="#fbbf24"/><rect class="s4g" x="591" y="100" width="164" height="2" rx="1" fill="#4ade80"/></g>
    <g><rect x="773" y="59" width="167" height="46" rx="12" fill="#111b2b" stroke="#176b53"/><rect class="stageGlow s5" x="773" y="59" width="167" height="46" rx="12" fill="#10b981"/><circle cx="792" cy="82" r="11" fill="#12372c" stroke="#10b981"/><text x="792" y="86" class="mono emerald" font-size="10" text-anchor="middle">5</text><text x="809" y="78" class="ui light" font-size="9.7" font-weight="650">Merkle Cache +</text><text x="809" y="91" class="ui light" font-size="9.7" font-weight="650">Canary</text><rect class="s5" x="779" y="100" width="155" height="2" rx="1" fill="#10b981"/></g>
